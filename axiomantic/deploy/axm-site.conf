# The live axiomantic.ru: /etc/nginx/sites-available/axm-site.conf.
# Certificates: Let's Encrypt (certbot), the ones the old site already has.
server {
    # http2 as a listen flag works on stock nginx 1.18-1.24 (Ubuntu, Debian);
    # 1.25.1+ only warns that it is deprecated in favour of "http2 on;".
    listen 443 ssl http2;
    server_name axiomantic.ru www.axiomantic.ru;

    ssl_certificate     /etc/letsencrypt/live/axiomantic.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axiomantic.ru/privkey.pem;

    include snippets/axm-site.conf;
}

server {
    listen 80;
    server_name axiomantic.ru www.axiomantic.ru;
    return 301 https://$host$request_uri;
}
