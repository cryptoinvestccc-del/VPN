# The new site on new.axiomantic.ru while the old one still serves
# axiomantic.ru: /etc/nginx/sites-available/axm-site-test.conf. Remove it
# after the switch. Its own certificate: certbot certonly --nginx -d new.axiomantic.ru
# Search engines are told to stay away; the site's sitemap and canonical
# links already name axiomantic.ru.
server {
    # http2 as a listen flag works on stock nginx 1.18-1.24 (Ubuntu, Debian);
    # 1.25.1+ only warns that it is deprecated in favour of "http2 on;".
    listen 443 ssl http2;
    server_name new.axiomantic.ru;

    ssl_certificate     /etc/letsencrypt/live/new.axiomantic.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.axiomantic.ru/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    include snippets/axm-site.conf;
}

server {
    listen 80;
    server_name new.axiomantic.ru;
    return 301 https://$host$request_uri;
}
