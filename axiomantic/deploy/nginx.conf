# Example server block for the studio site. Replace axiomantic.example and
# the certificate paths; the pages go to /var/www/axiomantic.
server {
    listen 443 ssl;
    http2 on;
    server_name axiomantic.example www.axiomantic.example;

    ssl_certificate     /etc/letsencrypt/live/axiomantic.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axiomantic.example/privkey.pem;

    root /var/www/axiomantic;
    index index.html;

    # pictures and video are already compressed; text is not
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-src https://yandex.ru; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404/index.html;

    # CSS and JS links carry a content hash, fonts and pictures rarely change.
    location /assets/ {
        expires 30d;
    }

    # Older nginx builds have no AVIF in mime.types; renders need the right type.
    location ~* ^/assets/img/.+\.avif$ {
        types { }
        default_type image/avif;
        expires 30d;
    }

    # The only dynamic address: order forms, handled by axiomantic-leads.
    location = /api/lead {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name axiomantic.example www.axiomantic.example;
    return 301 https://$host$request_uri;
}
