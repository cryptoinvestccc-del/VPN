# Example server block for the studio site. Replace axiomantic.example and
# the certificate paths. The panel publishes releases into
# /var/www/axiomantic/releases and points /var/www/axiomantic/current at
# the one in use, so the root below always serves a complete site.
server {
    # http2 as a listen flag works on stock nginx 1.18-1.24 (Ubuntu, Debian);
    # 1.25.1+ only warns that it is deprecated in favour of "http2 on;".
    listen 443 ssl http2;
    server_name axiomantic.example www.axiomantic.example;

    ssl_certificate     /etc/letsencrypt/live/axiomantic.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axiomantic.example/privkey.pem;

    root /var/www/axiomantic/current;
    index index.html;

    # pictures and video are already compressed; text is not
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # mc.yandex.ru: Yandex Metrika, when a counter is set in the panel; it
    # loads only after the visitor accepts cookies
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://mc.yandex.ru; style-src 'self'; font-src 'self'; script-src 'self' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru; frame-src https://yandex.ru https://mc.yandex.ru; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404/index.html;

    # CSS and JS links carry a content hash, fonts and pictures rarely change.
    location /assets/ {
        expires 30d;
    }

    # Older nginx builds have no AVIF in mime.types; renders need the right type.
    location ~* ^/assets/img/.+\.avif$ {
        types { }
        default_type image/avif;
        expires 30d;
    }

    # Order forms, handled by axiomantic-leads.
    location = /api/lead {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The team panel (axiomantic-leads -admin). The service sets the
    # panel's own CSP and headers; declaring add_header here stops the
    # site's headers above from being added on top of them.
    # To let only the office in, uncomment: allow 203.0.113.0/24; deny all;
    location /admin/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /admin {
        return 301 /admin/;
    }
    location /api/admin/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        # search queries carry names and phone numbers; keep them out of
        # the access log (sign-ins are logged by the service itself)
        access_log off;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name axiomantic.example www.axiomantic.example;
    return 301 https://$host$request_uri;
}
