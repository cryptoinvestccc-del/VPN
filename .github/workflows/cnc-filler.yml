name: cnc-filler
on:
  push:
    branches: [cnc-filler]
    paths: ['cnc-filler/**', '.github/workflows/cnc-filler.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cnc-filler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pytest
      - run: python src/cncfiller/build_db.py
      - run: python -m pytest -q tests
      - name: Живая проверка cnc1.ru
        id: live
        continue-on-error: true
        run: python tools/check_cnc1_live.py
      - name: Сохранить HTML cnc1.ru в ветку cnc-filler-live (для разбора разметки)
        if: always()
        shell: bash
        run: |
          [ -d live_html ] || exit 0
          cd live_html
          git init -q && git checkout -q -b cnc-filler-live
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "live html $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" cnc-filler-live
      - run: pyinstaller --noconfirm --onefile --windowed --name cnc-filler --paths src/cncfiller --add-data "data/catalog.db;data" src/cncfiller/app.py
      - uses: actions/upload-artifact@v4
        with: { name: cnc-filler-exe, path: cnc-filler/dist/cnc-filler.exe }
