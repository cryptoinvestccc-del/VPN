name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l . test/wireguard)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          (cd test/wireguard && go vet ./...)

      - name: Build
        run: go build ./...

      # The race detector is not optional here. Both of the defects that
      # made this tunnel unusable in practice — cross-wired clients and
      # dropped full-size packets — hid behind tests that ran one packet
      # through one client, and the concurrency bugs beside them only
      # surface under load with -race.
      - name: Unit and load tests
        run: go test -race -count=1 ./...

      # Runs the real WireGuard protocol at both ends of the tunnel via
      # wireguard-go's userspace stack. -short skips the rekey test, which
      # needs 2.5 minutes of wall clock.
      - name: Real WireGuard integration
        run: (cd test/wireguard && go test -race -count=1 -short ./...)

      # Exercises the shipped binaries with real config files and real
      # processes: package tests cannot catch a broken CLI flag, a config
      # field that never reaches the transport, or a service that dies on
      # SIGTERM instead of shutting down.
      - name: End-to-end
        run: ./scripts/e2e_test.sh

      # The runtime image has no shell and no libc, so a binary that
      # quietly regained a cgo dependency would produce an image that
      # cannot start. Building it here is what catches that.
      - name: Container image
        run: docker build -t obfsvpn:ci .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install
        run: npm ci
        working-directory: web

      # Type-aware rules, so this catches the class tsc cannot see: a
      # promise nobody awaits, a value that quietly became any, an
      # effect whose dependency list has gone stale behind a panel that
      # still looks live.
      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Build assets
        run: npm run build
        working-directory: web

      # The embedding path has its own build tag, so a plain `go build
      # ./...` never exercises it. Building it here is what catches an
      # //go:embed that stopped matching the assets it is meant to carry.
      - name: Build the binary with the assets embedded
        run: ./scripts/build-web.sh

      # A server that starts but serves nothing is the failure this
      # catches: the assets have to be reachable from the binary alone,
      # in a directory where web/dist does not exist.
      - name: Serve the embedded site
        run: |
          (cd /tmp && "$GITHUB_WORKSPACE/dist/obfsweb" -addr 127.0.0.1:8099 &)
          for _ in $(seq 20); do
            curl -fsS http://127.0.0.1:8099/healthz >/dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8099/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8099/api/v1/status | grep -q '"mock":true'
          curl -fsS 'http://127.0.0.1:8099/api/v1/dashboard?range=6h' | grep -q '"time_series"'
          # /dashboard is the second page; the SPA fallback has to serve
          # it rather than 404, or a bookmarked deep link breaks.
          curl -fsS http://127.0.0.1:8099/dashboard | grep -q '<div id="root">'
          # A path that names a file is a request for that file: robots.txt
          # exists and is served as itself, and a file that does not exist
          # is a 404 rather than the page with a 200.
          curl -fsS http://127.0.0.1:8099/robots.txt | grep -q 'User-agent'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/sitemap.xml)" = 404
          # The assets are gzipped at build time. A build that stopped
          # writing the .gz files would triple the transfer silently.
          asset="$(curl -fsS http://127.0.0.1:8099/ | grep -o '/assets/[^"]*\.js' | head -1)"
          curl -fsS -H 'Accept-Encoding: gzip' -D headers.txt -o /dev/null "http://127.0.0.1:8099$asset"
          grep -qi '^content-encoding: gzip' headers.txt
          grep -qi '^vary: .*accept-encoding' headers.txt

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Short fuzzing on every run, over the parsers an attacker reaches
      # before authenticating: the packet unwrapper on the public UDP port
      # and the frame reader inside TLS.
      - name: Fuzz parsers
        run: |
          go test -run='^$' -fuzz=FuzzUnwrap -fuzztime=60s ./internal/obfuscator/
          go test -run='^$' -fuzz=FuzzWrapUnwrapRoundTrip -fuzztime=60s ./internal/obfuscator/
          go test -run='^$' -fuzz=FuzzReadFrame -fuzztime=60s ./internal/transport/
          go test -run='^$' -fuzz=FuzzCannedResponse -fuzztime=60s ./internal/transport/

  rekey:
    # The rekey test spends 2.5 minutes proving a WireGuard session
    # renegotiates mid-flight without the tunnel losing the peer. Too slow
    # for every push, too important to never run.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: WireGuard rekey endurance
        run: (cd test/wireguard && go test -count=1 -timeout 10m -run TestRealWireGuardSurvivesRekey ./...)
