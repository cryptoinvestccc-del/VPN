# Учётные данные клиентов: у каждого устройства свой ключ, поэтому доступ
# можно отозвать одному, не трогая остальных.
#
# Общий psk такого не позволяет: чтобы отобрать доступ у одного, ключ
# пришлось бы менять всем — то есть каждый отзыв становился бы простоем
# для всех.
#
# Файл содержит ключи всех клиентов. Права — 0600, владелец — тот
# пользователь, под которым работает obfsserver.
#
# Не редактируй вручную без необходимости: obfsctl генерирует ключи с
# нормальной энтропией и не даст выдать один ключ двум устройствам, а это
# ровно та ошибка, которая молча лишает возможности отозвать любое из них.
#
#   obfsctl -file clients.yaml add laptop      # выдать доступ
#   obfsctl -file clients.yaml revoke laptop   # отозвать
#   obfsctl -file clients.yaml restore laptop  # вернуть
#   obfsctl -file clients.yaml list            # кто имеет доступ
#
# После изменений — перечитать без перезапуска:
#   systemctl reload obfsserver   (или kill -HUP <pid>)
#
# Живые сессии отозванного клиента закрываются в течение ~30 секунд, а не
# мгновенно: иначе отозванное устройство сохраняло бы доступ до тех пор,
# пока не переподключится само.

clients:
  - id: laptop
    psk: "REPLACE_WITH_BASE64_32_BYTE_KEY"

  - id: phone
    psk: "REPLACE_WITH_BASE64_32_BYTE_KEY"

    # Ротация ключа одного клиента без разрыва: новый ключ в psk, старый
    # сюда, пока устройство не обновится.
    # psk_previous: "OLD_KEY_DURING_ROTATION"

  - id: old-tablet
    psk: "REPLACE_WITH_BASE64_32_BYTE_KEY"
    # Запись сохраняется, а не удаляется: остаётся след о том, у кого был
    # доступ, и отзыв нельзя случайно отменить, просто "потеряв" строку.
    disabled: true
