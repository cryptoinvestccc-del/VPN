# Конфиг серверной стороны обфускатора (разворачивается на VPS рядом с
# реальным WireGuard-сервером).
# psk: тот же ключ, что в obfsclient.yaml
psk: "REPLACE_WITH_BASE64_32_BYTE_KEY"

# При ротации ключа: сгенерировать новый, положить его в psk, а старый —
# сюда (psk_previous). Сервер будет принимать пакеты под обоими ключами,
# пока не обновишь всех клиентов, потом это поле можно убрать.
# psk_previous: "OLD_KEY_DURING_ROTATION_WINDOW"

# Адрес реального WireGuard-сервера на этой же машине. ВАЖНО: сам WG
# должен слушать ТОЛЬКО на localhost (ListenPort привязан через
# `wg-quick`/iptables к 127.0.0.1, наружу не торчит) — иначе DPI увидит
# необфусцированный WireGuard напрямую на публичном порту.
local_addr: "127.0.0.1:51821"

# Публичный порт, на котором obfsserver слушает обфусцированный трафик
# (именно его указываем в remote_wire_addr на клиенте). Должен ОТЛИЧАТЬСЯ
# от порта реального WG-сервера (local_addr выше).
listen_wire_addr: "0.0.0.0:51820"
