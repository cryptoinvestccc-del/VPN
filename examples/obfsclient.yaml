# Конфиг клиентской стороны обфускатора.
# psk: сгенерировать одинаковый для клиента и сервера: openssl rand -base64 32
psk: "REPLACE_WITH_BASE64_32_BYTE_KEY"

# Локальный порт, на который WireGuard-клиент шлёт свои пакеты вместо
# реального сервера (укажи этот адрес как Endpoint в wg-конфиге клиента).
local_addr: "127.0.0.1:51821"

# Публичный адрес obfsserver на VPS.
remote_wire_addr: "YOUR_SERVER_IP:51820"

# Сколько мусорных пакетов послать перед первым реальным — ломает
# поведенческую эвристику DPI ("первый пакет = WG handshake").
junk_packets: 3
