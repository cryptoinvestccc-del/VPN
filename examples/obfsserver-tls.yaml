# Конфиг серверной стороны в режиме TLS (сильнее против активного
# DPI-пробинга, чем чистый UDP-режим): порт отвечает настоящим
# TLS-рукопожатием, поэтому проба "а что это за протокол на этом порту"
# видит легитимный TLS-сервер.
mode: "tls"

# ОБЯЗАТЕЛЕН. Именно PSK авторизует клиента: сертификат предъявляется
# каждому, кто подключается, поэтому его отпечаток секретом не является и
# роль пропуска играть не может. Ключи пакетов выводятся из PSK вместе с
# TLS-сессией — без PSK любой посторонний, завершивший рукопожатие,
# смог бы слать трафик в WireGuard за этим туннелем.
# Сгенерировать вместе с сертификатом: go run ./cmd/gencert
psk: "REPLACE_WITH_BASE64_32_BYTE_KEY"

# При ротации ключа старый кладётся сюда на время перехода.
# psk_previous: "OLD_KEY_DURING_ROTATION_WINDOW"

# Реальный WG-сервер слушает ТОЛЬКО на localhost.
local_addr: "127.0.0.1:51821"

# Публичный TCP-порт для TLS-обёртки. "[::]" на Linux — dual-stack
# (IPv6 + IPv4); "0.0.0.0" отрезал бы IPv6-only клиентов.
listen_tls_addr: "[::]:443"

# Сгенерировать: go run ./cmd/gencert -cn www.example.com -cert server.crt -key server.key
# (используй нейтральный cn, похожий на настоящий домен — это "cover identity")
cert_file: "server.crt"
key_file: "server.key"

# Куда отдавать соединения, не прошедшие аутентификацию (пробы DPI,
# сканеры, случайные браузеры). Если указан реальный веб-сервер — порт
# отвечает ровно так, как отвечал бы сайт за ним, и отличить его от
# обычного HTTPS-хостинга нельзя. Без этой опции возвращается
# правдоподобный ответ в стиле nginx — уже не молчание, но и не
# настоящий сайт.
# fallback_addr: "127.0.0.1:8080"
